<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramondrole - Угадай число</title>
    <link rel="icon" href="./Ramondrole.webp">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="guess.css">
</head>
<body>
    <nav>
        <div class="logo">RAMONDROLE</div>
        <div class="nav-links">
            <a href="https://ramondrole.github.io/Pogreb_Ramondrole-About_me/" data-key="about">Обо мне</a>
            <a href="https://ramondrole.github.io/Pogreb_Ramondrole-Games/" data-key="gamesTitle">Наши игры</a>
            <a href="https://ramondrole.github.io/Pogreb_Ramondrole-Userful_functions/" data-key="functions">Полезные функции</a>
        </div>
        <div class="language-switcher">
            <button class="lang-btn" id="langBtn">🌐 RU</button>
            <ul class="lang-dropdown">
                <li><a href="#" data-lang="ru">🇷🇺 Русский</a></li>
                <li><a href="#" data-lang="en">🇺🇸 English</a></li>
                <li><a href="#" data-lang="de">🇩🇪 Deutsch</a></li>
            </ul>
        </div>
    </nav>

    <div class="guess-wrapper">
        <h1 id="gameTitle" data-key="gameTitle">Угадай число</h1>
        
        <div class="game-container">
            <div class="numbers-grid" id="numbersGrid">
                <button class="number-btn" data-num="1">1</button>
                <button class="number-btn" data-num="2">2</button>
                <button class="number-btn" data-num="3">3</button>
                <button class="number-btn" data-num="4">4</button>
                <button class="number-btn" data-num="5">5</button>
                <button class="number-btn" data-num="6">6</button>
                <button class="number-btn" data-num="7">7</button>
                <button class="number-btn" data-num="8">8</button>
                <button class="number-btn" data-num="9">9</button>
                <button class="number-btn" data-num="10">10</button>
            </div>
            
            <button class="newgame-btn" id="newGameBtn" data-key="newGame">Новая игра</button>
            
            <div class="stats">
                <p class="attempts" data-key="attempts">Попытки: <span id="attemptsCount">3</span>!</p>
                <p class="hint" id="hintText" data-key="hintStart">Чего ждешь? Ткни кнопку!</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="guess.js"></script>
</body>
</html>
